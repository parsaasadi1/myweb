<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صفحه تست من</title>
  <style>
    :root {
      --bg: #12261f;
      --card: #f3efe4;
      --ink: #12261f;
      --accent: #e0a526;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      font-family: Tahoma, "Segoe UI", sans-serif;
      color: var(--ink);
    }
    main {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 1.7rem; }
    p { margin: 0 0 24px; line-height: 1.9; }
    .count {
      font-size: 3.4rem;
      font-weight: bold;
      margin-bottom: 20px;
    }
    button {
      font: inherit;
      font-weight: bold;
      background: var(--accent);
      color: var(--ink);
      border: 0;
      border-radius: 12px;
      padding: 12px 28px;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .status { margin-top: 20px; font-size: .9rem; min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>سایت من آنلاین شد 🎉</h1>
    <p>اگر این صفحه را از طریق لینک گیت‌هاب می‌بینید، آپلود و فعال‌سازی Pages درست انجام شده است.</p>
    <div class="count" id="count">0</div>
    <button id="btn" type="button">یکی اضافه کن</button>
    <div class="status" id="status"></div>
  </main>

  <script>
    var n = 0;
    var count = document.getElementById("count");
    var status = document.getElementById("status");
    document.getElementById("btn").addEventListener("click", function () {
      n++;
      count.textContent = n;
      status.textContent = "جاوااسکریپت هم کار می‌کند ✓";
    });
  </script>
</body>
</html>
